<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacances</title>
<meta name="theme-color" content="#16181C">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#16181C; color:#F2F4F7;
    font-family:"Roboto","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:34px 22px calc(34px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .rayures{
    height:12px; border-radius:2px; margin-bottom:26px;
    background:repeating-linear-gradient(-45deg,#F2B705 0 12px,#16181C 12px 24px);
  }
  p.sur{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#F2B705; margin:0;}
  h1{font-size:44px; line-height:.9; margin:8px 0 26px; font-weight:900; letter-spacing:-.04em; text-transform:uppercase;}
  a.jeu{
    display:block; text-decoration:none; border-radius:6px; padding:20px;
    margin-bottom:13px; position:relative; overflow:hidden; color:#15130F;
    background:#E6E1D6;
  }
  a.jeu:active{transform:scale(.98);}
  a.jeu::before{content:""; position:absolute; left:0; top:0; bottom:0; width:9px; background:#F2B705;}
  a.sud::before{background:#12448F;}
  .nom{display:block; font-size:22px; font-weight:900; text-transform:uppercase; letter-spacing:-.02em;}
  .txt{display:block; font-size:14px; color:#3A3730; margin-top:5px; line-height:1.35;}
  .bientot{opacity:.4; pointer-events:none;}
  .note{font-size:12px; color:#6E6A61; text-align:center; margin-top:20px; line-height:1.5;}
</style>
</head>
<body>
  <div class="rayures"></div>
  <p class="sur">Pavy &amp; Fils</p>
  <h1>Vacances<br>2026</h1>

  <a class="jeu sud" href="./cap-au-sud.html">
    <span class="nom">Cap au Sud</span>
    <span class="txt">Le jeu du trajet : Liévin → Les Arcs. Repérage, quiz et bingo du voyage.</span>
  </a>

  <a class="jeu" href="./la-grue.html">
    <span class="nom">La Grue</span>
    <span class="txt">Empilage de caisses à la grue. Mode découverte pour Valentin, mode chantier pour Jules.</span>
  </a>

  <p class="note">Ajoute cette page à l'écran d'accueil pour retrouver les jeux d'un seul geste.</p>
</body>
</html>
