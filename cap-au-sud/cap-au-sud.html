<style>
  :root{
    --bleu:#12448F; --bleu-fonce:#0B2E63; --blanc:#F2F4F7; --asphalte:#23252A;
    --nuit:#16181C; --brun:#6E4A2B; --soleil:#E4A11B; --vert:#3E8E5A;
    --rouge:#C8402F; --gris:#8A8F98;
    --ui:"Roboto","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Roboto Mono",ui-monospace,"Noto Sans Mono",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    background:var(--nuit); color:var(--blanc); font-family:var(--ui);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{flex:0 0 auto; background:var(--bleu); border-bottom:3px solid var(--bleu-fonce); padding:10px 14px 12px;}
  .bandeau{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .parcouru{font-family:var(--mono); font-size:25px; font-weight:700; line-height:1;}
  .parcouru span{font-size:12px; font-weight:400; opacity:.75;}
  .restant{font-family:var(--mono); font-size:11px; opacity:.85; text-align:right; line-height:1.4;}
  .jauge{margin-top:9px; height:8px; background:rgba(0,0,0,.32); border-radius:99px; overflow:hidden;}
  .jauge div{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--blanc),var(--soleil)); transition:width .5s cubic-bezier(.2,.8,.3,1);}
  nav{flex:0 0 auto; display:flex; background:var(--bleu-fonce);}
  nav button{flex:1; border:0; background:none; color:rgba(242,244,247,.55);
    font-family:var(--ui); font-size:10px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; padding:13px 2px 11px; cursor:pointer; border-bottom:3px solid transparent;}
  nav button.on{color:var(--blanc); border-bottom-color:var(--soleil);}
  main{flex:1; position:relative; overflow:hidden;}
  .vue{position:absolute; inset:0; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .vue.on{display:block;}

  /* ---- choix du trajet ---- */
  .bloc{padding:18px 16px 30px; max-width:620px; margin:0 auto;}
  .titre{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--soleil); font-weight:700; margin:0 0 4px;}
  .consigne{font-size:21px; font-weight:700; line-height:1.2; margin:0 0 16px; letter-spacing:-.02em;}
  .champ{margin-bottom:14px;}
  .champ label{display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gris); margin-bottom:6px; font-weight:700;}
  .champ input{
    width:100%; background:#2A2D34; border:2px solid #3A3E46; border-radius:8px;
    color:var(--blanc); font-family:var(--ui); font-size:17px; padding:13px 14px;
  }
  .champ input:focus{border-color:var(--soleil); outline:none;}
  .choisie{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bleu); border:2px solid var(--blanc); border-radius:8px; padding:12px 14px;
  }
  .choisie b{font-size:17px;}
  .choisie i{font-style:normal; font-family:var(--mono); font-size:11px; opacity:.8;}
  .choisie button{background:none; border:1px solid rgba(255,255,255,.5); color:var(--blanc);
    border-radius:5px; font-family:var(--mono); font-size:11px; padding:6px 10px; cursor:pointer;}
  .resultats{margin-top:8px; display:flex; flex-direction:column; gap:6px; max-height:270px; overflow-y:auto;}
  .resultat{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:#2A2D34; border:1px solid #3A3E46; border-radius:7px; padding:11px 13px;
    color:var(--blanc); font-family:var(--ui); font-size:15px; cursor:pointer; text-align:left;
  }
  .resultat small{font-family:var(--mono); font-size:11px; color:var(--gris); flex:0 0 auto;}
  .apercu{background:#2A2D34; border-radius:9px; padding:15px; margin:16px 0; font-size:14px; line-height:1.5;}
  .apercu b{color:var(--soleil); font-family:var(--mono);}
  .btn{width:100%; border:0; border-radius:7px; padding:15px; background:var(--blanc); color:var(--nuit);
    font-family:var(--ui); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.05em; cursor:pointer;}
  .btn:disabled{opacity:.35;}
  .btn.sec{background:none; color:var(--gris); border:1px solid #3A3E46; margin-top:9px;}

  /* ---- route ---- */
  #route{position:relative; padding:26px 0 40px;}
  .bitume{position:absolute; left:50%; transform:translateX(-50%); width:74px; top:0; bottom:0;
    background:var(--asphalte); border-left:3px solid rgba(242,244,247,.55); border-right:3px solid rgba(242,244,247,.55);}
  .bitume::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:5px; transform:translateX(-50%);
    background:repeating-linear-gradient(to bottom,rgba(242,244,247,.75) 0 26px,transparent 26px 60px);}
  .etape{position:absolute; left:0; right:0; display:flex; align-items:center; transform:translateY(-50%);}
  .etape .cote{width:calc(50% - 46px); padding:0 10px; display:flex;}
  .etape.g .cote:first-child{justify-content:flex-end;}
  .etape.d .cote:first-child{visibility:hidden;}
  .etape.g .cote:last-child{visibility:hidden;}
  .plot{width:92px; flex:0 0 92px; display:flex; align-items:center; justify-content:center;}
  .bille{width:15px; height:15px; border-radius:50%; background:var(--asphalte); border:3px solid var(--gris);}
  .etape.faite .bille{background:var(--soleil); border-color:var(--blanc);}
  .panneau{background:var(--bleu); border:2px solid var(--blanc); border-radius:7px; padding:7px 11px;
    cursor:pointer; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.35); max-width:100%;
    font-family:var(--ui); color:var(--blanc); opacity:.32; transition:opacity .3s;}
  .etape.faite .panneau{opacity:1;}
  .panneau b{display:block; font-size:13px; font-weight:700; letter-spacing:-.01em; line-height:1.15;}
  .panneau i{display:block; font-style:normal; font-family:var(--mono); font-size:10px; opacity:.75; margin-top:3px;}
  .etape.arrivee .panneau{background:var(--soleil); color:#2A1E06; border-color:#2A1E06;}
  #voiture{position:absolute; left:50%; transform:translate(-50%,-50%); font-size:33px; z-index:5;
    transition:top .6s cubic-bezier(.2,.8,.3,1); filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));}

  /* ---- jeux ---- */
  .grille{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .objet{aspect-ratio:1; border:0; border-radius:10px; cursor:pointer; background:#2A2D34;
    font-size:min(13vw,52px); line-height:1; display:flex; align-items:center; justify-content:center;
    transition:transform .1s, background .2s;}
  .objet:active{transform:scale(.94);}
  .objet.bon{background:var(--vert);} .objet.faux{background:var(--rouge);}
  .compte{background:#2A2D34; border-radius:10px; padding:20px 14px; margin-bottom:14px; text-align:center;
    font-size:min(11vw,44px); line-height:1.5; word-break:break-word;}
  .chiffres{display:grid; grid-template-columns:repeat(5,1fr); gap:9px;}
  .chiffre{border:0; border-radius:10px; background:var(--blanc); color:var(--nuit); font-family:var(--mono);
    font-weight:700; font-size:25px; padding:16px 0; cursor:pointer;}
  .chiffre.bon{background:var(--vert); color:#fff;} .chiffre.faux{background:var(--rouge); color:#fff;}
  .question{background:var(--bleu); border:2px solid var(--blanc); border-radius:9px; padding:16px;
    font-size:17px; font-weight:600; line-height:1.3; margin-bottom:14px;}
  .reps{display:flex; flex-direction:column; gap:9px;}
  .rep{border:2px solid #3A3E46; background:#2A2D34; color:var(--blanc); border-radius:8px;
    padding:14px 16px; text-align:left; cursor:pointer; font-family:var(--ui); font-size:16px; line-height:1.25;}
  .rep.bon{background:var(--vert); border-color:var(--vert);} .rep.faux{background:var(--rouge); border-color:var(--rouge);}
  .serie{font-family:var(--mono); font-size:12px; color:var(--gris); margin:14px 0 0; text-align:center;}
  .bingo{display:grid; grid-template-columns:repeat(2,1fr); gap:9px;}
  .case{display:flex; align-items:center; gap:9px; text-align:left; background:#2A2D34; border:2px solid #3A3E46;
    border-radius:9px; padding:11px 10px; cursor:pointer; color:var(--blanc); font-family:var(--ui);
    font-size:13px; line-height:1.2; min-height:62px;}
  .case .e{font-size:23px; flex:0 0 auto;}
  .case.ok{background:var(--vert); border-color:var(--vert); text-decoration:line-through; opacity:.75;}

  .voile{position:fixed; inset:0; background:rgba(11,17,28,.86); display:none; align-items:center;
    justify-content:center; padding:22px; z-index:40;}
  .voile.on{display:flex;}
  .fiche{background:var(--brun); border:3px solid var(--blanc); border-radius:10px; padding:20px; max-width:400px; width:100%;}
  .fiche h3{margin:0 0 3px; font-size:22px; letter-spacing:-.02em;}
  .fiche .km{font-family:var(--mono); font-size:11px; opacity:.8; margin:0 0 12px;}
  .fiche p{margin:0 0 18px; font-size:15px; line-height:1.45;}
  #gain{position:fixed; left:50%; top:96px; transform:translateX(-50%); background:var(--soleil); color:#2A1E06;
    font-family:var(--mono); font-weight:700; padding:9px 17px; border-radius:99px; font-size:16px;
    opacity:0; z-index:50; pointer-events:none;}
  #gain.pop{animation:gain 1.3s ease-out;}
  @keyframes gain{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}
    25%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  .pied{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; padding:6px 16px 22px;}
  .mini{background:none; border:1px solid #3A3E46; color:var(--gris); font-family:var(--mono); font-size:11px;
    letter-spacing:.08em; padding:8px 13px; border-radius:5px; cursor:pointer; text-transform:uppercase;}
  .mini[aria-pressed="true"]{color:var(--soleil); border-color:var(--soleil);}
  #install{display:none; color:var(--soleil); border-color:var(--soleil);}
  #install.on{display:inline-block;}
  :focus-visible{outline:3px solid var(--soleil); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}
</style>
</head>
<body>

<header>
  <div class="bandeau">
    <div class="parcouru"><b id="km">0</b> <span>km parcourus</span></div>
    <div class="restant" id="restant">Choisis ton trajet</div>
  </div>
  <div class="jauge"><div id="jauge"></div></div>
</header>

<nav>
  <button data-vue="depart">Trajet</button>
  <button class="on" data-vue="carte">Carte</button>
  <button data-vue="repere">Copilote</button>
  <button data-vue="quiz">Navigateur</button>
  <button data-vue="bingo">Bingo</button>
</nav>

<main>
  <section class="vue" id="v-depart">
    <div class="bloc">
      <p class="titre">Feuille de route</p>
      <p class="consigne">D'où part-on, et où va-t-on ?</p>

      <div class="champ">
        <label>Ville de départ</label>
        <div id="zone-a"></div>
      </div>
      <div class="champ">
        <label>Ville d'arrivée</label>

let actx = null;
function audio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function blip(f,d,t,v){
  if(!sonOn) return;
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = t||'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(v||.09, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d);
}

const $ = id => document.getElementById(id);
const melange = t => t.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
const sansAccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* distance a vol d'oiseau, en km */
function vol(la1, lo1, la2, lo2){
  const R = 6371, r = Math.PI/180;
  const dla = (la2-la1)*r, dlo = (lo2-lo1)*r;
  const x = Math.sin(dla/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function faitDe(v){
  if(FAITS[v[0]]) return FAITS[v[0]];
  const d = DEPS[v[3]];
  if(!d) return "Une étape sur la route.";
  if(d[1] === v[0]) return "Préfecture du département " + d[0] + " (" + v[3] + "), en région " + d[2] + ".";
  return "Dans le département " + d[0] + " (" + v[3] + "), en région " + d[2] + ". La préfecture est " + d[1] + ".";
}

/* ============ calcul du trajet ============ */
function construireTrajet(iA, iB){
  const A = VILLES[iA], B = VILLES[iB];
  const brut = vol(A[1], A[2], B[1], B[2]);
  const D = Math.max(20, Math.round(brut * 1.22));    /* la route est plus longue que l'oiseau */
  const dla = B[1]-A[1], dlo = (B[2]-A[2]) * Math.cos((A[1]+B[1])/2 * Math.PI/180);
  const norme = dla*dla + dlo*dlo;
  const couloir = Math.max(25, Math.min(70, brut * 0.09));

  const cand = [];
  for(let i = 0; i < VILLES.length; i++){
    if(i === iA || i === iB) continue;
    const v = VILLES[i];
    const pla = v[1]-A[1], plo = (v[2]-A[2]) * Math.cos((A[1]+v[1])/2 * Math.PI/180);
    const t = norme ? (pla*dla + plo*dlo) / norme : 0;
    if(t < 0.03 || t > 0.97) continue;
    const ecart = vol(A[1]+dla*t, A[2]+(B[2]-A[2])*t, v[1], v[2]);
    if(ecart > couloir) continue;
    const note = (FAITS[v[0]] ? 6000000 : 0) + v[4] - ecart * 6000;
    cand.push({ i, t, note, v });
  }
  cand.sort((x,y) => y.note - x.note);

  const ecartMini = 1 / 13;
  const gardees = [];
  for(const c of cand){
    if(gardees.length >= 12) break;
    if(gardees.every(g => Math.abs(g.t - c.t) > ecartMini)) gardees.push(c);
  }
  gardees.sort((x,y) => x.t - y.t);

  const etapes = [{ n:A[0], dep:A[3], km:0, t:faitDe(A) }];
  gardees.forEach(g => etapes.push({ n:g.v[0], dep:g.v[3], km:Math.round(g.t * D), t:faitDe(g.v) }));
  etapes.push({ n:B[0], dep:B[3], km:D, t:faitDe(B) });

  /* on evite deux etapes au meme kilometrage */
  for(let i = 1; i < etapes.length; i++){
    if(etapes[i].km <= etapes[i-1].km) etapes[i].km = etapes[i-1].km + 1;
  }
  etapes[etapes.length-1].km = Math.max(D, etapes[etapes.length-1].km);

  return { a:A[0], b:B[0], D:etapes[etapes.length-1].km, etapes, questions:questionsPour(etapes) };
}

/* ============ questions engendrees par le trajet ============ */
function questionsPour(etapes){
  const Q = [];
  const codes = [...new Set(etapes.map(e => e.dep))].filter(c => DEPS[c]);
  const tousCodes = Object.keys(DEPS);
  const pioche = (source, exclure, n) => {
    const out = [];
    const dispo = melange(source.filter(x => x !== exclure));
    for(const x of dispo){ if(out.length >= n) break; if(!out.includes(x)) out.push(x); }
    return out;
  };

  codes.forEach(c => {
    const d = DEPS[c];
    Q.push({ q:"Quel est le numéro du département " + d[0] + " ?",
             r:[c].concat(pioche(tousCodes, c, 3)), b:0 });
    Q.push({ q:"Quelle est la préfecture du département " + d[0] + " ?",
             r:[d[1]].concat(pioche(tousCodes.map(x => DEPS[x][1]), d[1], 3)), b:0 });
    Q.push({ q:"Dans quelle région se trouve le département " + d[0] + " ?",
             r:[d[2]].concat(pioche([...new Set(tousCodes.map(x => DEPS[x][2]))], d[2], 3)), b:0 });
  });

  etapes.forEach(e => {
    const d = DEPS[e.dep];
    if(!d) return;
    Q.push({ q:"Dans quel département se trouve " + e.n + " ?",
             r:[d[0]].concat(pioche(tousCodes.map(x => DEPS[x][0]), d[0], 3)), b:0 });
  });

  const D = etapes[etapes.length-1].km;
  const moitie = Math.round(D/2), tiers = Math.round(D/3);
  Q.push({ q:"Le trajet fait " + D + " km. On en a fait la moitié : combien de km ?",
           r:[moitie + " km", (moitie+50) + " km", (moitie-70) + " km", Math.round(D/4) + " km"], b:0 });
  Q.push({ q:"Il reste " + tiers + " km sur les " + D + ". Combien en a-t-on déjà fait ?",
           r:[(D-tiers) + " km", tiers + " km", moitie + " km", Math.round(D*0.8) + " km"], b:0 });
  Q.push({ q:"À 120 km/h sans s'arrêter, combien de temps pour 360 km ?",
           r:["3 heures","2 heures","4 heures","5 heures"], b:0 });
  Q.push({ q:"À 110 km/h, quelle distance parcourt-on en 2 heures ?",
           r:["220 km","110 km","330 km","180 km"], b:0 });
  Q.push({ q:"Sur autoroute, quelle est la vitesse maximale quand il pleut ?",
           r:["110 km/h","130 km/h","90 km/h","100 km/h"], b:0 });
  Q.push({ q:"De quelle couleur sont les panneaux d'autoroute en France ?",
           r:["Bleu","Vert","Marron","Blanc"], b:0 });
  Q.push({ q:"Que produisent les éoliennes qu'on voit dans les champs ?",
           r:["De l'électricité","De l'eau","Du vent","Du gaz"], b:0 });
  Q.push({ q:"Combien de départements compte la France métropolitaine ?",
           r:["96","101","83","75"], b:0 });
  Q.push({ q:"Ce trajet fait environ combien de kilomètres ?",
           r:[D + " km", Math.round(D*1.8) + " km", Math.round(D*0.45) + " km", Math.round(D*2.6) + " km"], b:0 });

  return melange(Q).filter((q,i,t) => t.findIndex(x => x.q === q.q) === i);
}

/* ============ choix des villes ============ */
let choixA = null, choixB = null;

function champVille(zoneId, quel){
  const z = $(zoneId);
  const choix = quel === 'a' ? choixA : choixB;
  z.innerHTML = '';
  if(choix !== null){
    const v = VILLES[choix];
    const d = DEPS[v[3]];
    const box = document.createElement('div');
    box.className = 'choisie';
    box.innerHTML = '<div><b>' + v[0] + '</b><br><i>' + v[3] + ' · ' + (d ? d[0] : '') + '</i></div>';
    const b = document.createElement('button');
    b.textContent = 'Changer';
    b.addEventListener('click', () => {
      if(quel === 'a') choixA = null; else choixB = null;
      champVille(zoneId, quel); majApercu();
    });
    box.appendChild(b);
    z.appendChild(box);
    return;
  }
  const inp = document.createElement('input');
  inp.type = 'search';
  inp.placeholder = 'Tape les premières lettres…';
  inp.autocomplete = 'off';
  const res = document.createElement('div');
  res.className = 'resultats';
  inp.addEventListener('input', () => {
    const q = sansAccent(inp.value.trim());
    res.innerHTML = '';
    if(q.length < 2) return;
    const trouve = [];
    for(let i = 0; i < VILLES.length && trouve.length < 40; i++){
      if(sansAccent(VILLES[i][0]).startsWith(q)) trouve.push(i);
    }
    if(!trouve.length){
      for(let i = 0; i < VILLES.length && trouve.length < 40; i++){
        if(sansAccent(VILLES[i][0]).includes(q)) trouve.push(i);
      }
    }
    trouve.slice(0, 25).forEach(i => {
      const v = VILLES[i], d = DEPS[v[3]];
      const b = document.createElement('button');
      b.className = 'resultat';
      b.innerHTML = '<span>' + v[0] + '</span><small>' + v[3] + ' · ' + (d ? d[0] : '') + '</small>';
      b.addEventListener('click', () => {
        if(quel === 'a') choixA = i; else choixB = i;
        champVille(zoneId, quel); majApercu();
      });
      res.appendChild(b);
    });
  });
  z.appendChild(inp);
  z.appendChild(res);
}

function majApercu(){
  const ok = choixA !== null && choixB !== null && choixA !== choixB;
  $('lancer').disabled = !ok;
  if(choixA !== null && choixB !== null && choixA === choixB){
    $('apercu').textContent = "Le départ et l'arrivée sont la même ville.";
    return;
  }
  if(!ok){
    $('apercu').textContent = "Choisis deux villes parmi les 1891 disponibles, environ vingt par département.";
    return;
  }
  const t = construireTrajet(choixA, choixB);
  const deps = [...new Set(t.etapes.map(e => e.dep))].length;
  $('apercu').innerHTML = 'De <b>' + t.a + '</b> à <b>' + t.b + '</b><br>Environ <b>' + t.D +
    ' km</b>, <b>' + (t.etapes.length - 2) + '</b> étapes, <b>' + deps + '</b> départements traversés.';
}

$('lancer').addEventListener('click', () => {
  audio();
  TRAJET = construireTrajet(choixA, choixB);
  km = 0; coches = []; bonsQ = 0; bonsR = 0; serieQ = 0; paquet = []; qActuelle = null;
  store.set('gt.trajet', JSON.stringify([choixA, choixB]));
  store.set('gt.km', 0); store.set('gt.bingo', '[]');
  majBandeau(); dessinerRoute(); dessinerBingo();
  $('zone-repere').innerHTML = '';
  ouvrir('carte');
  dire('En route pour ' + TRAJET.b + ' !');
});

/* ============ progression ============ */
function avancer(gain){
  if(!TRAJET) return;
  const avant = km;
  km = Math.min(TRAJET.D, km + gain);
  store.set('gt.km', km);
  majBandeau(); majVoiture();
  $('gain').textContent = '+' + gain + ' km';
  $('gain').classList.remove('pop'); void $('gain').offsetWidth; $('gain').classList.add('pop');
  const f = TRAJET.etapes.filter(e => e.km > avant && e.km <= km).pop();
  if(f) setTimeout(() => ficheEtape(f, true), 500);
  dessinerRoute();
}

function majBandeau(){
  $('km').textContent = km;
  if(!TRAJET){ $('restant').textContent = 'Choisis ton trajet'; $('jauge').style.width = '0%'; return; }
  const r = TRAJET.D - km;
  $('restant').innerHTML = r > 0 ? r + ' km avant<br>' + TRAJET.b : 'Arrivés à ' + TRAJET.b + ' !';
  $('jauge').style.width = (km / TRAJET.D * 100) + '%';
}

const H_ROUTE = 1500;
function dessinerRoute(){
  const r = $('route');
  [...r.querySelectorAll('.etape')].forEach(n => n.remove());
  if(!TRAJET){ r.style.height = '260px'; $('voiture').style.top = '30px'; return; }
  r.style.height = (H_ROUTE + 60) + 'px';
  TRAJET.etapes.forEach((e, i) => {
    const d = document.createElement('div');
    d.className = 'etape ' + (i % 2 ? 'd' : 'g') + (km >= e.km ? ' faite' : '')
                + (i === TRAJET.etapes.length - 1 ? ' arrivee' : '');
    d.style.top = (30 + e.km / TRAJET.D * H_ROUTE) + 'px';
    const p = '<button class="panneau"><b>' + e.n + '</b><i>' + e.km + ' km · ' + e.dep + '</i></button>';
    d.innerHTML = '<div class="cote">' + p + '</div><div class="plot"><div class="bille"></div></div><div class="cote">' + p + '</div>';
    d.querySelectorAll('.panneau').forEach(b => b.addEventListener('click', () => {
      if(km >= e.km) ficheEtape(e, false);
      else {
        sFaux();
        $('gain').textContent = 'Encore ' + (e.km - km) + ' km';
        $('gain').classList.remove('pop'); void $('gain').offsetWidth; $('gain').classList.add('pop');
      }
    }));
    r.appendChild(d);
  });
  majVoiture();
}
function majVoiture(){
  $('voiture').style.top = TRAJET ? (30 + km / TRAJET.D * H_ROUTE) + 'px' : '30px';
}
function ficheEtape(e, nouvelle){
  $('f-nom').textContent = nouvelle ? 'Nous passons à ' + e.n : e.n;
  $('f-km').textContent = e.km + ' km depuis ' + TRAJET.a + ' · ' + (TRAJET.D - e.km) + ' km restants';
  $('f-txt').textContent = e.t;
  $('voile').classList.add('on');
  if(nouvelle){
    sFete();
    dire(e.km >= TRAJET.D ? 'Nous sommes arrivés à ' + TRAJET.b + ' !' : 'Nous passons à ' + e.n);
  }
}
$('f-ok').addEventListener('click', () => $('voile').classList.remove('on'));

/* ============ niveau Copilote ============ */
let repEnCours = false;
function tourRepere(){
  repEnCours = false;
  const z = $('zone-repere');
  z.innerHTML = '';
  $('serie-r').textContent = bonsR + ' bonnes réponses';
  const compter = Math.random() < .4;
  if(!compter){
    const tirage = melange(OBJETS).slice(0, 6);
    const cible = tirage[Math.floor(Math.random() * 6)];
    $('consigne').textContent = 'Trouve ' + cible.s;
    dire('Trouve ' + cible.s);
    const g = document.createElement('div');
    g.className = 'grille';
    tirage.forEach(o => {
      const b = document.createElement('button');
      b.className = 'objet'; b.textContent = o.e; b.setAttribute('aria-label', o.s);
      b.addEventListener('click', () => {
        if(repEnCours) return;
        if(o === cible){
          repEnCours = true; b.classList.add('bon'); sBon(); bonsR++;
          dire('Bravo ! ' + cible.s); avancer(8); setTimeout(tourRepere, 1700);
        } else {
          b.classList.add('faux'); sFaux();
          dire("Non, ça c'est " + o.s + ". Essaie encore.");
          setTimeout(() => b.classList.remove('faux'), 700);
        }
      });
      g.appendChild(b);
    });
    z.appendChild(g);
  } else {
    const o = OBJETS[Math.floor(Math.random() * OBJETS.length)];
    const n = 1 + Math.floor(Math.random() * 5);
    $('consigne').textContent = 'Combien y a-t-il de ' + o.p + ' ?';
    dire('Combien y a-t-il de ' + o.p + ' ?');
    const c = document.createElement('div');
    c.className = 'compte';
    c.textContent = new Array(n).fill(o.e).join(' ');
    z.appendChild(c);
    const g = document.createElement('div');
    g.className = 'chiffres';
    for(let i = 1; i <= 5; i++){
      const b = document.createElement('button');
      b.className = 'chiffre'; b.textContent = i;
      b.addEventListener('click', () => {
        if(repEnCours) return;
        if(i === n){
          repEnCours = true; b.classList.add('bon'); sBon(); bonsR++;
          dire('Oui ! ' + n + ' ' + (n > 1 ? o.p : o.s)); avancer(8);
          setTimeout(tourRepere, 1900);
        } else {
          b.classList.add('faux'); sFaux(); dire('Recompte bien.');
          setTimeout(() => b.classList.remove('faux'), 700);
        }
      });
      g.appendChild(b);
    }
    z.appendChild(g);
  }
}

/* ============ niveau Navigateur ============ */
let paquet = [], qActuelle = null, quizVerrou = false;
function tourQuiz(){
  if(!TRAJET){ $('q-texte').textContent = "Choisis d'abord un trajet dans l'onglet Trajet."; $('q-reps').innerHTML = ''; return; }
  quizVerrou = false;
  if(!paquet.length) paquet = melange(TRAJET.questions.map((q,i) => i));
  qActuelle = TRAJET.questions[paquet.pop()];
  $('q-texte').textContent = qActuelle.q;
  $('serie-q').textContent = bonsQ + ' bonnes réponses · série de ' + serieQ;
  const zone = $('q-reps');
  zone.innerHTML = '';
  const bonne = qActuelle.r[qActuelle.b];
  melange(qActuelle.r).forEach(txt => {
    const b = document.createElement('button');
    b.className = 'rep'; b.textContent = txt;
    b.addEventListener('click', () => {
      if(quizVerrou) return;
      quizVerrou = true;
      if(txt === bonne){
        b.classList.add('bon'); sBon(); bonsQ++; serieQ++;
        avancer(15 + (serieQ >= 3 ? 10 : 0));
      } else {
        b.classList.add('faux'); sFaux(); serieQ = 0;
        const j = [...zone.children].find(x => x.textContent === bonne);
        if(j) j.classList.add('bon');
      }
      setTimeout(tourQuiz, 1600);
    });
    zone.appendChild(b);
  });
}

/* ============ bingo ============ */
function dessinerBingo(){
  const z = $('bingo');
  z.innerHTML = '';
  BINGO.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'case' + (coches.includes(i) ? ' ok' : '');
    b.innerHTML = '<span class="e">' + it.e + '</span><span>' + it.t + '</span>';
    b.addEventListener('click', () => {
      if(coches.includes(i) || !TRAJET) return;
      coches.push(i);
      store.set('gt.bingo', JSON.stringify(coches));
      b.classList.add('ok'); sBon(); avancer(25);
      $('serie-b').textContent = coches.length + ' / ' + BINGO.length + ' trouvés';
      if(coches.length === BINGO.length){ sFete(); dire('Bingo complet, bravo !'); }
    });
    z.appendChild(b);
  });
  $('serie-b').textContent = coches.length + ' / ' + BINGO.length + ' trouvés';
}

/* ============ navigation ============ */
function ouvrir(v){
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.vue === v));
  document.querySelectorAll('.vue').forEach(x => x.classList.remove('on'));
  $('v-' + v).classList.add('on');
  if(v === 'repere' && TRAJET && !$('zone-repere').children.length) tourRepere();
  if(v === 'quiz' && !qActuelle) tourQuiz();
  if(v === 'carte' && TRAJET){
    const y = 30 + km / TRAJET.D * H_ROUTE;
    $('v-carte').scrollTo({ top:Math.max(0, y - $('v-carte').clientHeight / 2), behavior:'smooth' });
  }
  if(v !== 'repere' && v !== 'quiz'){ try{ speechSynthesis.cancel(); }catch(e){} }
}
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => { audio(); ouvrir(b.dataset.vue); });
});

$('son').addEventListener('click', e => {
  sonOn = !sonOn;
  store.set('gt.son', sonOn ? '1' : '0');
  e.currentTarget.textContent = 'Son : ' + (sonOn ? 'on' : 'off');
  e.currentTarget.setAttribute('aria-pressed', sonOn);
  if(!sonOn){ try{ speechSynthesis.cancel(); }catch(err){} } else sBon();
});
$('reset').addEventListener('click', () => {
  if(!confirm('Remettre le compteur à zéro pour ce trajet ?')) return;
  km = 0; coches = []; bonsQ = 0; bonsR = 0; serieQ = 0;
  store.set('gt.km', 0); store.set('gt.bingo', '[]');
  majBandeau(); dessinerRoute(); dessinerBingo();
});

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ try{ speechSynthesis.cancel(); }catch(e){} }
});

let promptInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); promptInstall = e; $('install').classList.add('on');
});
$('install').addEventListener('click', async () => {
  if(!promptInstall){
    alert("Sur iPhone : bouton Partager, puis « Sur l'écran d'accueil ».\nSur Android : menu ⋮ de Chrome, puis « Installer l'application ».");
    return;
  }
  promptInstall.prompt(); await promptInstall.userChoice;
  promptInstall = null; $('install').classList.remove('on');
});
window.addEventListener('appinstalled', () => $('install').classList.remove('on'));

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw-sud.js').catch(()=>{}));
}

/* ============ demarrage ============ */
$('son').textContent = 'Son : ' + (sonOn ? 'on' : 'off');
$('son').setAttribute('aria-pressed', sonOn);
try{ coches = JSON.parse(store.get('gt.bingo') || '[]'); }catch(e){ coches = []; }

const sauve = store.get('gt.trajet');
if(sauve){
  try{
    const [a, b] = JSON.parse(sauve);
    if(VILLES[a] && VILLES[b] && a !== b){
      choixA = a; choixB = b;
      TRAJET = construireTrajet(a, b);
      km = Math.min(TRAJET.D, +store.get('gt.km') || 0);
    }
  }catch(e){}
}
champVille('zone-a','a'); champVille('zone-b','b');
majApercu();
majBandeau(); dessinerRoute(); dessinerBingo();
if(!TRAJET) ouvrir('depart');
else setTimeout(() => {
  const y = 30 + km / TRAJET.D * H_ROUTE;
  $('v-carte').scrollTo({ top:Math.max(0, y - $('v-carte').clientHeight / 2) });
}, 60);
</script>
